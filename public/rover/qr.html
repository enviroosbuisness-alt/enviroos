<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR cards · Enviro Rover</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5ee;color:#1c392c;font:16px system-ui}main{max-width:960px;margin:auto;padding:32px 20px}a{color:#246044}h1{font-size:clamp(32px,6vw,54px);margin:28px 0 6px}form,article{background:white;border:1px solid #c9d3c6;border-radius:12px;padding:16px}form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px}input,select,button{padding:10px;border:1px solid #a5b6a3;border-radius:6px;font:inherit}button{background:#24543c;color:white;cursor:pointer}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}article img{display:block;width:132px;max-width:100%;margin:0 auto}h3{margin:6px 0}small{display:block;margin-bottom:10px}</style>
<link rel="stylesheet" href="enviroos-theme.css"><main><a href="index.html">← Mission control</a><h1>QR cards</h1><p>Print a card and place it where the rover should act.</p><h2>Add a stop</h2><form id="form"><label>Stop name<input id="label" required maxlength="48" placeholder="Greenhouse entrance"></label><label>Direction<select id="direction"><option value="forward">Straight</option><option value="left">Left</option><option value="right">Right</option><option value="backward">Back</option><option value="farmland">Farmland inspection</option></select></label><label>Wait in seconds<input id="wait" type="number" min="0" max="3600" step="1" value="3" required></label><button>Save card</button></form><p role="status" id="status"></p><h2>Field cards</h2><section id="cards"></section></main>
<script type="module" src="qr.js"></script></html>
