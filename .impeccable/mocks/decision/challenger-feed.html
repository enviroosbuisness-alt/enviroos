<!doctype html><html lang="hi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif;background:linear-gradient(180deg,#274E13 0%,#16290B 70%,#0E1C07 100%);color:#fff}
.prog{display:flex;gap:6px;padding:16px 16px 0}
.prog i{flex:1;height:3.5px;border-radius:3px;background:rgba(255,255,255,.30)}
.prog i.on{background:#fff}
.top{padding:12px 16px 0;font-size:12.5px;font-weight:700;opacity:.9}
.stage{padding:120px 24px 0}
.kick{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:99px}
.giant{font-size:120px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.mean{font-size:26px;font-weight:800;margin-top:6px}
.todo{font-size:16px;font-weight:500;opacity:.92;margin-top:6px}
.cap{position:absolute;left:16px;bottom:170px;right:86px;background:rgba(0,0,0,.45);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:500;line-height:1.45}
.cap b{font-weight:800}
.rail{position:absolute;right:12px;bottom:170px;display:flex;flex-direction:column;gap:14px}
.rail span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:20px;font-weight:800}
.rail span.go{background:#fff;color:#1B4D12}
.hint{position:absolute;bottom:86px;left:0;right:0;text-align:center;font-size:12.5px;font-weight:700;opacity:.75}
.nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:rgba(0,0,0,.5);display:flex}
.nav div{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.6)}
.nav div.on{color:#fff;border-top:3px solid #fff}
</style></head><body>
<div class="prog"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
<div class="top">नोड 1 · बाजरा · 2 / 5</div>
<div class="stage"><span class="kick">पानी</span><div class="giant">28%</div><div class="mean">सिंचाई रोकें</div><div class="todo">मिट्टी में नमी काफी है — शाम को फिर देखें</div></div>
<div class="cap"><b>एग्री:</b> “आज पानी मत दीजिए। कल सुबह नमी जांचेंगे।”</div>
<div class="rail"><span class="go">▶</span><span>🎙</span><span>💧</span><span>✓</span></div>
<div class="hint">ऊपर स्वाइप · अगला — धूप</div>
<div class="nav"><div class="on">होम</div><div>मिट्टी</div><div>फसल</div><div>मौसम</div><div>एग्री</div></div>
</body></html>
