<!doctype html><html lang="hi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif;background:#F8F2DF;color:#211B10}
.sheet{margin:10px;border:2.5px solid #211B10;border-radius:6px;background:#F8F2DF;height:824px;position:relative;overflow:hidden}
.mast{background:#B3261E;color:#FFF6E3;padding:12px 16px 10px}
.mast b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.mast span{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;margin:12px;border:2px solid #211B10}
.cell{padding:14px 12px 12px;border:1px solid #211B10;background:#FFFDF4}
.cell:nth-child(1){background:#FFF3D6}
.lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6B5F43}
.num{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.word{font-size:14.5px;font-weight:800;margin-top:2px}
.hd{display:flex;align-items:center;gap:7px;margin-top:8px}
.spk{width:26px;height:26px;border-radius:50%;border:2px solid #1B5E20;display:grid;place-items:center}
.spk b{width:0;height:0;border-left:8px solid #1B5E20;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.hd span{font-size:11.5px;font-weight:700;color:#1B5E20}
.seal{margin:0 12px;border:2px solid #1B5E20;border-radius:6px;background:#E7F0DA;padding:11px 14px;display:flex;gap:10px;align-items:center}
.seal .ok{width:34px;height:34px;border-radius:50%;background:#1B5E20;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.seal b{font-size:14.5px}.seal span{font-size:12px;font-weight:500;color:#3E4A33}
.hear{position:absolute;left:12px;right:12px;bottom:86px;background:#1B5E20;color:#fff;border-radius:8px;padding:16px;text-align:center;font-size:18px;font-weight:800}
.nav{position:absolute;bottom:0;left:0;right:0;height:64px;border-top:2.5px solid #211B10;display:flex;background:#F8F2DF}
.nav div{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#6B5F43;border-right:1px solid #211B10}
.nav div.on{background:#211B10;color:#FFF6E3}
</style></head><body>
<div class="sheet">
<div class="mast"><b>खेत · आज का हाल</b><span>नोड 1 · बाजरा · बढ़वार</span></div>
<div class="grid">
<div class="cell"><div class="lab">पानी</div><div class="num">28%</div><div class="word">रोकें</div><div class="hd"><span class="spk"><b></b></span><span>सुनें</span></div></div>
<div class="cell"><div class="lab">गर्मी</div><div class="num">37°</div><div class="word">तेज़ है</div><div class="hd"><span class="spk"><b></b></span><span>सुनें</span></div></div>
<div class="cell"><div class="lab">धूप</div><div class="num">64K</div><div class="word">बहुत तेज़</div><div class="hd"><span class="spk"><b></b></span><span>सुनें</span></div></div>
<div class="cell"><div class="lab">हवा</div><div class="num">34%</div><div class="word">ठीक है</div><div class="hd"><span class="spk"><b></b></span><span>सुनें</span></div></div>
</div>
<div class="seal"><span class="ok">✓</span><span><b>एग्री की सलाह तैयार है</b><br><span>दबाएं और सुनें — 12 सेकंड</span></span></div>
<div class="hear">▶ &nbsp;सब सुनें</div>
<div class="nav"><div class="on">होम</div><div>मिट्टी</div><div>फसल</div><div>मौसम</div><div>एग्री</div></div>
</div>
</body></html>
