<!doctype html><html lang="hi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif;background:#F7F8FA;color:#111827}
.hd{padding:20px 20px 4px}
.hd small{font-size:13px;color:#6B7280;font-weight:500}
.hd b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.sec{font-size:12.5px;font-weight:700;color:#6B7280;margin:18px 20px 10px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:#fff;border:1px solid #E8EBF0;border-radius:16px;padding:16px 14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:800;margin-bottom:10px}
.card small{font-size:12px;color:#6B7280;font-weight:600}
.card b{display:block;font-size:22px;font-weight:800;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px}
.alert{margin:4px 16px 0;background:#FFFBEB;border:1px solid #FDE68A;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.alert .n{font-size:24px;font-weight:800}
.alert b{font-size:14.5px}.alert span{font-size:12.5px;color:#92400E}
.nav{position:absolute;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #E8EBF0;display:flex}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:#9AA1B2}
.nav div.on{color:#2563EB}
.nav i{width:21px;height:21px;border-radius:7px;background:#E4E7EE}
.nav div.on i{background:#2563EB}
</style></head><body>
<div class="hd"><small>Tuesday, 7:00 AM</small><b>Farm overview</b></div>
<div class="sec">Needs attention</div>
<div class="alert"><span class="n">4</span><span><b>Things to check</b><br><span>Heat stress · sunlight · air · nutrients</span></span></div>
<div class="sec">Field status</div>
<div class="grid">
<div class="card"><span class="ic" style="background:#E0F2FE">≈</span><small>Water</small><b>28%</b><span class="pill" style="background:#FEF3C7;color:#92400E">Hold irrigation</span></div>
<div class="card"><span class="ic" style="background:#FEF3C7">~</span><small>Heat</small><b>37°C</b><span class="pill" style="background:#FEE2E2;color:#991B1B">Heat stress</span></div>
<div class="card"><span class="ic" style="background:#E8F5E9">≋</span><small>Soil</small><b>N 42</b><span class="pill" style="background:#E8F5E9;color:#1B5E20">Balanced</span></div>
<div class="card"><span class="ic" style="background:#F3E8FF">☁</span><small>Weather</small><b>Steady</b><span class="pill" style="background:#F3F4F6;color:#4B5563">Stable</span></div>
</div>
<div class="nav"><div class="on"><i></i>Home</div><div><i></i>Soil</div><div><i></i>Crop</div><div><i></i>Weather</div><div><i></i>Agri</div></div>
</body></html>
