<!doctype html><html lang="hi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif;background:#F5F1E4;color:#1A2413}
.shell{background:#1B4D12;color:#fff;padding:16px 16px 13px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em}
.guide{font-size:12.5px;opacity:.88;margin-top:3px;font-weight:500}
.thread{padding:12px 12px 0;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;background:#E3DBC4;font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:99px;color:#5A5340}
.bub{background:#fff;border-radius:4px 18px 18px 18px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.10);max-width:322px}
.who{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.av{width:30px;height:30px;border-radius:50%;background:#2E7D32;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.nm{font-size:13px;font-weight:800}.tm{font-size:11px;color:#6B7263;font-weight:500}
.vn{display:flex;align-items:center;gap:10px;background:#EDF2E3;border-radius:14px;padding:10px 12px}
.play{width:48px;height:48px;border-radius:50%;background:#2E7D32;display:grid;place-items:center;flex:none}
.play b{width:0;height:0;border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px}
.wv{display:flex;align-items:center;gap:2.5px;flex:1;height:32px}
.wv i{width:3px;background:#7A9A6D;border-radius:2px}
.dur{font-size:12px;font-weight:800;color:#2E7D32;white-space:nowrap}
.big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{font-size:14.5px;font-weight:700;margin-top:3px}
.act{font-size:13px;font-weight:500;color:#3A4632;margin-top:4px}
.warn{background:#FDF0C4;border:1px solid #E0B73C}
.mini{display:flex;align-items:center;gap:8px;margin-top:9px}
.mini .play{width:34px;height:34px}.mini .play b{border-left-width:10px;border-top-width:6px;border-bottom-width:6px}
.minil{font-size:12.5px;font-weight:700;color:#7A5B00}
.composer{margin:10px 12px 0;background:#fff;border-radius:18px;padding:9px 9px 9px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.composer span{flex:1;font-size:14px;color:#8A8F7E;font-weight:500}
.mic{width:52px;height:52px;border-radius:50%;background:#2E7D32;display:grid;place-items:center}
.mic u{width:16px;height:24px;border:3px solid #fff;border-radius:9px;position:relative}
.mic u:after{content:'';position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);width:3px;height:8px;background:#fff}
.nav{position:absolute;bottom:0;left:0;right:0;height:66px;background:#fff;border-top:1px solid #E2DCC8;display:flex}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:#8A8F7E}
.nav div.on{color:#1B4D12}
.nav i{width:22px;height:22px;border-radius:7px;background:#D8DCCB}
.nav div.on i{background:#1B4D12}
</style></head><body>
<div class="shell"><div class="brand">EnviroOS</div><div class="guide">नोड 1 · बाजरा · बढ़वार</div></div>
<div class="thread">
<div class="day">आज · सुबह 7:00</div>
<div class="bub"><div class="who"><span class="av">ए</span><span><span class="nm">एग्री</span><br><span class="tm">खेत की सलाह</span></span></div>
<div class="vn"><span class="play"><b></b></span><span class="wv"><i style="height:10px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:14px"></i><i style="height:30px"></i><i style="height:20px"></i><i style="height:12px"></i><i style="height:24px"></i><i style="height:32px"></i><i style="height:16px"></i><i style="height:22px"></i><i style="height:10px"></i><i style="height:28px"></i><i style="height:18px"></i></span><span class="dur">0:12</span></div></div>
<div class="bub"><div class="big">28%</div><div class="sub">मिट्टी में पानी</div><div class="act">सिंचाई रोकें — नमी काफी है</div>
<div class="mini"><span class="play"><b></b></span><span class="minil">सुनें · 0:06</span></div></div>
<div class="bub warn"><div class="sub">4 जांचें बाकी हैं</div><div class="act">गर्मी · धूप · हवा · पोषण</div></div>
</div>
<div class="composer"><span>पूछें… “पानी कब दूं?”</span><span class="mic"><u></u></span></div>
<div class="nav"><div class="on"><i></i>होम</div><div><i></i>मिट्टी</div><div><i></i>फसल</div><div><i></i>मौसम</div><div><i></i>रिकॉर्ड</div><div><i></i>एग्री</div></div>
</body></html>
